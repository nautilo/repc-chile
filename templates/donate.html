{% extends 'base.html' %}{% block content %}<div class="formbox wide"><span class="eyebrow">NUEVA DONACIÓN</span><h1>Dale una segunda vida a un computador</h1><form method="post" class="gridform"><label>Marca<input name="brand" required placeholder="Lenovo"></label><label>Modelo<input name="model" required placeholder="ThinkPad T480"></label><label>Procesador<input name="cpu" required placeholder="Intel i5-8350U"></label><label>RAM (GB)<input name="ram" type="number" value="8" min="1"></label><label>Almacenamiento (GB)<input name="storage" type="number" value="256"></label><label>Salud batería (%)<input name="battery" type="number" value="80" min="0" max="100"></label><label>Peso aprox. (kg)<input name="weight" type="number" step=".01" value="1.5"></label><label class="full">Observaciones<textarea name="notes" placeholder="Estado físico, cargador, fallas conocidas..."></textarea></label><button class="full">Registrar computador</button></form></div>{% endblock %}

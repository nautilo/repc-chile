{% extends 'base.html' %}{% block content %}<div class="head"><div><span class="eyebrow">COLEGIOS NODO</span><h1>La red empieza en la escuela</h1></div></div><div class="split"><div>{% for s in schools %}<article class="school"><b>🏫 {{s.name}}</b><span>{{s.city}}</span><p>📦 Recibe {% if s.repairs %} · 🔧 Repara{% endif %}{% if s.certifies %} · ✅ Certifica{% endif %}</p></article>{% endfor %}</div><div class="formbox"><h2>Inscribir mi colegio</h2><form method="post"><label>Establecimiento<input name="name" required></label><label>Comuna/ciudad<input name="city" required></label><label class="check"><input type="checkbox" name="repairs"> Puede facilitar espacio de reparación</label><label class="check"><input type="checkbox" name="certifies"> Puede certificar equipos</label><button>Solicitar inscripción</button></form></div></div>{% endblock %}

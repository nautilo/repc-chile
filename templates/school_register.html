{% extends 'base.html' %}{% block content %}<div class="formbox wide"><span class="eyebrow">COLEGIOS RePC</span><h1>Inscribir mi colegio</h1><p>Crea la cuenta institucional del coordinador y registra el establecimiento como nodo de la red.</p><form method="post" class="gridform"><label>Nombre del coordinador<input name="name" required></label><label>Correo institucional<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" required minlength="6"></label><label>Establecimiento<input name="school_name" required></label><label>Comuna / ciudad<input name="city" required></label><label class="check"><input type="checkbox" name="repairs"> Puede facilitar espacio para reparación</label><label class="check"><input type="checkbox" name="certifies"> Puede certificar equipos</label><button class="full">Inscribir colegio y crear cuenta</button></form></div>{% endblock %}
